  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  json_serializable: ^6.13.0
  freezed: ^3.2.5

  
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/data/
  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
