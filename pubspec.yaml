name: mh_assistant
description: "Mental health assistant"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  freezed_annotation: ^3.1.0
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^8.1.0
  firebase_core: ^4.9.0
